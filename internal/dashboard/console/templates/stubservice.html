{{define "content"}}
<div class="overview-strip">
  <div class="card">
    <div class="label">Project</div>
    <div class="value mono"><span id="project">-</span></div>
    <div class="sub">default project id</div>
  </div>
  <div class="card">
    <div class="label">Surface</div>
    <div class="value mono" style="font-size: 14px;"><span id="surface">-</span></div>
    <div class="sub">reachable wire surface</div>
  </div>
  <div class="card">
    <div class="label">State</div>
    <div class="value"><span class="pill warn">stub</span></div>
    <div class="sub">data ops unimplemented</div>
  </div>
</div>
<div class="hint-block" style="margin-top: 16px;">
  <span id="note"></span>
</div>
{{end}}
