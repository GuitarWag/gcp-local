{{define "content"}}
<div class="split">
  <div class="col">
    <h3>Topics</h3>
    <ul id="topics" class="kv"></ul>
    <h3>Publish test message</h3>
    <form id="publish">
      <textarea name="data" rows="3" placeholder="message body"></textarea>
      <button type="submit">Publish to selected topic</button>
    </form>
    <div id="publish-status" class="status"></div>
  </div>
  <div class="col">
    <h3>Subscriptions</h3>
    <ul id="subs" class="kv"></ul>
    <h3 id="peek-title">Messages (peek)</h3>
    <div id="peek"></div>
  </div>
</div>
{{end}}
