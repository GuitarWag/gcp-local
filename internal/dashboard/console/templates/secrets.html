{{define "content"}}
<div class="split">
  <div class="col">
    <h3>Secrets</h3>
    <ul id="secrets" class="kv"></ul>
  </div>
  <div class="col">
    <h3 id="versions-title">Versions</h3>
    <table class="compact">
      <thead><tr><th>Version</th><th>State</th><th>Created</th><th></th></tr></thead>
      <tbody id="versions"></tbody>
    </table>
    <h3 id="payload-title">Payload</h3>
    <pre class="payload" id="payload">Reveal a version to see its payload.</pre>
  </div>
</div>
{{end}}
